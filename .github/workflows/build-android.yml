name: Build SkinFlow Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and verify SkinFlow upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.1'
          cache: true

      - name: Build v0.1.0 baseline for upgrade test
        run: |
          git worktree add --detach /tmp/skinflow-v01 origin/main
          cd /tmp/skinflow-v01
          flutter create . --platforms=android --org com.kisama --project-name kilife
          python3 tool/patch_android.py
          rm -f test/widget_test.dart
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/SkinFlow-v0.1.0-baseline.apk

      - name: Generate Android project wrapper
        run: |
          flutter create . --platforms=android --org com.kisama --project-name kilife
          python3 tool/patch_android.py
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify install-over-v0.1.0
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install /tmp/SkinFlow-v0.1.0-baseline.apk
            adb shell dumpsys package com.kisama.kilife | grep -F 'versionName=0.1.0'
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb shell dumpsys package com.kisama.kilife | grep -F 'versionName=0.2.0'
            adb shell pm path com.kisama.kilife

      - name: Prepare APK artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk SkinFlow-v0.2.0.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SkinFlow-Android
          path: SkinFlow-v0.2.0.apk
          if-no-files-found: error
          retention-days: 30
