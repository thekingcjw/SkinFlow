name: Build SkinFlow Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and verify SkinFlow release
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.1'
          cache: true

      - name: Generate Android project wrapper
        run: |
          flutter create . --platforms=android --org com.kisama --project-name kilife
          rm -f test/widget_test.dart

      - name: Configure permanent SkinFlow signing
        env:
          KEYSTORE_B64: ${{ secrets.SKINFLOW_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SKINFLOW_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SKINFLOW_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Permanent SkinFlow signing secrets are not configured yet."
            exit 0
          fi

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/skinflow-release.jks"

          # The keystore is generated with one fixed, non-secret alias. Validate it
          # before Gradle starts so a mistyped repository secret cannot break signing.
          keytool -list \
            -keystore "$RUNNER_TEMP/skinflow-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias skinflow-release >/dev/null

          {
            echo "SKINFLOW_KEYSTORE_PATH=$RUNNER_TEMP/skinflow-release.jks"
            echo "SKINFLOW_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "SKINFLOW_KEY_ALIAS=skinflow-release"
            echo "SKINFLOW_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Patch Android project
        run: python3 tool/patch_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --force-jit --delete-conflicting-outputs

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Require permanent release signing
        run: |
          if [ -z "${SKINFLOW_KEYSTORE_PATH:-}" ]; then
            echo "::error::Permanent SkinFlow release signing is not configured. Add the SKINFLOW_KEYSTORE_B64, SKINFLOW_KEYSTORE_PASSWORD, and SKINFLOW_KEY_PASSWORD repository secrets."
            exit 1
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify release certificate
        run: |
          CERT_OUTPUT="$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          echo "$CERT_OUTPUT"
          echo "$CERT_OUTPUT" | grep -Fi 'ad3ec4433c24735ef425ef8199f2088b9377bf830da95665c9117aad3fa18592'

      - name: Verify clean install and package identity
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install build/app/outputs/flutter-apk/app-release.apk
            adb shell dumpsys package com.kisama.kilife | grep -F 'versionName=0.2.0'
            adb shell pm path com.kisama.kilife

      - name: Prepare APK artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk SkinFlow-v0.2.0.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SkinFlow-Android
          path: SkinFlow-v0.2.0.apk
          if-no-files-found: error
          retention-days: 30
