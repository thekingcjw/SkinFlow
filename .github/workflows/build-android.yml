name: Build SkinFlow Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SkinFlow APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.1'
          cache: true

      - name: Generate Android project wrapper
        run: |
          flutter create . --platforms=android --org com.kisama --project-name kilife
          python3 tool/patch_android.py
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare APK artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk SkinFlow-v0.2.0.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SkinFlow-Android
          path: SkinFlow-v0.2.0.apk
          if-no-files-found: error
          retention-days: 30
